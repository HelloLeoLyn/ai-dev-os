spring.application.name=orchestrator
server.port=18080
openclaw.gateway-url=${OPENCLAW_GATEWAY_URL:ws://127.0.0.1:18789}
openclaw.token=${OPENCLAW_GATEWAY_TOKEN:}
openclaw.request-timeout=${OPENCLAW_REQUEST_TIMEOUT:130s}
openclaw.agent-wait-timeout=${OPENCLAW_AGENT_WAIT_TIMEOUT:120s}
command.policy.enabled=false
command.policy.default-action=DENY
execution.jobs.capacity=100
execution.jobs.worker-id=${AI_DEV_OS_WORKER_ID:}
execution.jobs.lease-duration=${AI_DEV_OS_WORKER_LEASE_DURATION:30m}
execution.jobs.heartbeat-interval=${AI_DEV_OS_WORKER_HEARTBEAT_INTERVAL:}
execution.jobs.shutdown-timeout=${AI_DEV_OS_WORKER_SHUTDOWN_TIMEOUT:30s}
execution.jobs.reaper-interval=${AI_DEV_OS_LEASE_REAPER_INTERVAL:30s}
execution.jobs.reaper-batch-size=${AI_DEV_OS_LEASE_REAPER_BATCH_SIZE:100}
execution.jobs.attempt-recovery-interval=${AI_DEV_OS_ATTEMPT_RECOVERY_INTERVAL:30s}
coding.workspace.allowed-roots=${AI_DEV_OS_WORKSPACE_ROOT:${user.dir}}
coding.approval.required-for-workspace-write=true
coding.artifacts.max-content-length=${CODING_ARTIFACT_MAX_CONTENT_LENGTH:262144}
coding.artifacts.max-untracked-file-bytes=${CODING_UNTRACKED_MAX_FILE_BYTES:262144}
coding.codex.executable=${CODEX_EXECUTABLE:codex}
coding.codex.approval-policy=${CODEX_APPROVAL_POLICY:never}
coding.codex.timeout=${CODEX_EXECUTION_TIMEOUT:10m}
tools.mcp.enabled=false
testagent.workdir=${AI_DEV_OS_TEST_WORKDIR:${user.dir}}
testagent.command-timeout=${AI_DEV_OS_TEST_COMMAND_TIMEOUT:10m}
testagent.artifacts-dir=${AI_DEV_OS_TEST_ARTIFACTS_DIR:${user.dir}/test-artifacts}
testagent.browser.executor=${AI_DEV_OS_BROWSER_EXECUTOR:playwright}
testagent.browser.command=${AI_DEV_OS_BROWSER_COMMAND:npx playwright test}
testagent.browser.workdir=${AI_DEV_OS_BROWSER_WORKDIR:${user.dir}}
testagent.browser.screenshots-dir=${AI_DEV_OS_BROWSER_SCREENSHOTS_DIR:}
testagent.browser.timeout=${AI_DEV_OS_BROWSER_TIMEOUT:15m}
testagent.browser.openclaw-agent=${AI_DEV_OS_BROWSER_OPENCLAW_AGENT:browser-agent}
aidevos.persistence.type=${AI_DEV_OS_PERSISTENCE_TYPE:in-memory}
aidevos.persistence.postgresql.url=${AI_DEV_OS_POSTGRES_URL:jdbc:postgresql://localhost:5432/ai_dev_os}
aidevos.persistence.postgresql.username=${AI_DEV_OS_POSTGRES_USER:ai_dev_os}
aidevos.persistence.postgresql.password=${AI_DEV_OS_POSTGRES_PASSWORD:}
aidevos.policy.version=${AI_DEV_OS_POLICY_VERSION:v1}
outbox.relay.interval=${AI_DEV_OS_OUTBOX_RELAY_INTERVAL:1s}
outbox.relay.batch-size=${AI_DEV_OS_OUTBOX_RELAY_BATCH_SIZE:100}
outbox.relay.max-attempts=${AI_DEV_OS_OUTBOX_RELAY_MAX_ATTEMPTS:8}
outbox.relay.backoff-base=${AI_DEV_OS_OUTBOX_RELAY_BACKOFF_BASE:1s}
outbox.relay.backoff-max=${AI_DEV_OS_OUTBOX_RELAY_BACKOFF_MAX:60s}
