agents:
  - name: planner
    executor: mock
    capabilities:
      - analysis

  - name: executor
    executor: mock
    capabilities:
      - coding
      - git

  - name: coder
    description: Executes coding tasks
    enabled: true
    type: system
    permissionLevel: standard
    executor: codex
    codex:
      workspace:
      model:
      sandbox: workspace-write
    capabilities:
      - coding
      - git
    skillIds:
      - coding-skill

  - name: tester
    executor: openclaw
    openclaw:
      agentId: main
    capabilities:
      - testing
      - browser
    skillIds:
      - testing-skill
      - browser-skill

  - name: browser-agent
    executor: openclaw
    openclaw:
      agentId: main
    capabilities:
      - browser
    skillIds:
      - browser-skill

  - name: mcp-reader
    description: Executes explicitly declared read-only tool calls
    enabled: true
    type: system
    permissionLevel: read-only
    executor: tool
    capabilities:
      - tool
      - read-only
