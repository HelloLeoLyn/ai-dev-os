agents:
  - name: planner
    executor: mock
    version: 1.0.0
    capabilities:
      - planning
      - analysis

  - name: analyst
    description: Performs read-only project analysis with Codex
    enabled: true
    type: system
    permissionLevel: read-only
    version: 1.0.0
    executor: codex
    codex:
      workspace:
      model: deepseek-v4-flash
      sandbox: read-only
    capabilities:
      - analysis
      - read-only

  - name: executor
    executor: mock
    version: 1.0.0
    capabilities:
      - coding
      - git

  - name: coder
    description: Executes coding tasks
    enabled: true
    type: system
    permissionLevel: standard
    version: 1.0.0
    executor: codex
    codex:
      workspace:
      model: deepseek-v4-flash
      sandbox: workspace-write
    capabilities:
      - coding
      - git
    skillIds:
      - coding-skill

  - name: tester
    executor: openclaw
    version: 1.0.0
    openclaw:
      agentId: main
    capabilities:
      - testing
      - browser
    skillIds:
      - testing-skill
      - browser-skill

  - name: browser-agent
    executor: openclaw
    version: 1.0.0
    openclaw:
      agentId: main
    capabilities:
      - browser
    skillIds:
      - browser-skill

  - name: mcp-reader
    description: Executes explicitly declared read-only tool calls
    enabled: true
    type: system
    permissionLevel: read-only
    version: 1.0.0
    executor: tool
    capabilities:
      - tool
      - read-only
