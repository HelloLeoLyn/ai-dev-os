agents:
  - name: planner
    executor: mock
    capabilities:
      - analysis

  - name: executor
    executor: mock
    capabilities:
      - coding
      - git

  - name: coder
    description: Executes coding tasks
    enabled: true
    type: system
    permissionLevel: standard
    executor: codex
    codex:
      workspace:
      model:
    capabilities:
      - coding
      - git

  - name: tester
    executor: openclaw
    openclaw:
      agentId: main
    capabilities:
      - testing
      - browser

  - name: browser-agent
    executor: openclaw
    openclaw:
      agentId: main
    capabilities:
      - browser
