# Phase 13-A-2: dedicated test profile.
# Pins the settings that @SpringBootTest contexts depend on so tests are not
# affected by developer-machine env vars (AI_DEV_OS_* / OPENCLAW_* overrides
# in production application.properties).

# Persistence: always in-memory unless a test explicitly opts into PostgreSQL.
aidevos.persistence.type=in-memory
aidevos.persistence.postgresql.url=jdbc:postgresql://localhost:5432/ai_dev_os_test
aidevos.persistence.postgresql.username=ai_dev_os
aidevos.persistence.postgresql.password=

# MCP: never enabled in tests.
tools.mcp.enabled=false

# OpenClaw gateway: pinned to the local default; tests never reach a real gateway.
openclaw.gateway-url=ws://127.0.0.1:18789
openclaw.token=
openclaw.request-timeout=130s
openclaw.agent-wait-timeout=120s

# Outbox relay: deterministic settings for PostgreSQL-mode context tests.
outbox.relay.interval=1s
outbox.relay.batch-size=100
outbox.relay.max-attempts=8
outbox.relay.backoff-base=1s
outbox.relay.backoff-max=60s
